<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Members - استعادة وتعيين كلمة المرور</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235b6af0' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='11' width='18' height='11' rx='2' ry='2'/%3E%3Cpath d='M7 11V7a5 5 0 0 1 10 0v4'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#07070f;--sidebar:#0b0b18;--surface:#10101e;--surface2:#16162a;
    --border:#ffffff0c;--border2:#ffffff18;
    --accent:#5b6af0;--accent2:#818cf8;--accent-glow:#5b6af040;
    --text:#dde1ff;--muted:#4a4f7a;--online:#34d399;
    --logo-font:'Outfit',sans-serif;--crt:none;
  }
  body.theme-steins{
    --bg:#020c02;--surface:#051405;--surface2:#071a07;
    --border:#00ff4115;--border2:#00ff4128;
    --accent:#00ff41;--accent2:#39ff14;--accent-glow:#00ff4140;
    --text:#c8ffc8;--muted:#3a6b3a;
    --logo-font:'VT323',monospace;
    --crt:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px);
  }
  body.theme-crimson{
    --bg:#0f0608;--surface:#1a080b;--surface2:#220c10;
    --border:#ff173515;--border2:#ff173528;
    --accent:#ff1735;--accent2:#ff6b7a;--accent-glow:#ff173540;
    --text:#ffd6da;--muted:#6b3a3e;
    --logo-font:'Outfit',sans-serif;--crt:none;
  }
  body.theme-amber{
    --bg:#0d0900;--surface:#181000;--surface2:#201500;
    --border:#ffb30015;--border2:#ffb30028;
    --accent:#ffb300;--accent2:#ffd54f;--accent-glow:#ffb30040;
    --text:#fff3cc;--muted:#6b5200;
    --logo-font:'Outfit',sans-serif;--crt:none;
  }
  body.theme-cyan{
    --bg:#00080f;--surface:#001219;--surface2:#001a24;
    --border:#00d4ff15;--border2:#00d4ff28;
    --accent:#00d4ff;--accent2:#67e8f9;--accent-glow:#00d4ff40;
    --text:#ccf5ff;--muted:#1a5566;
    --logo-font:'Share Tech Mono',monospace;--crt:none;
  }
  body.theme-white{
    --bg:#f5f7fb;--surface:#f0f3fa;--surface2:#e6ebf6;
    --border:#1f29370f;--border2:#1f293726;
    --accent:#2563eb;--accent2:#4f46e5;--accent-glow:#2563eb40;
    --text:#0f172a;--muted:#64748b;
    --logo-font:'Outfit',sans-serif;--crt:none;
  }
  body.theme-black{
    --bg:#050505;--surface:#111111;--surface2:#181818;
    --border:#ffffff12;--border2:#ffffff1f;
    --accent:#f1f5f9;--accent2:#d4d4d8;--accent-glow:#ffffff2b;
    --text:#f5f5f5;--muted:#a1a1aa;
    --logo-font:'Share Tech Mono',monospace;--crt:none;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'IBM Plex Sans Arabic',sans-serif;
    background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;transition:background .4s,color .4s;
    padding:20px;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background:
      radial-gradient(ellipse at 25% 40%, var(--accent-glow) 0%, transparent 55%),
      radial-gradient(ellipse at 75% 70%, var(--accent-glow) 0%, transparent 50%);
    pointer-events:none;transition:background .4s;
  }
  body::after{
    content:'';position:fixed;inset:0;
    background:var(--crt);pointer-events:none;z-index:9999;
  }

  /* Particles */
  .particles{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .particle{
    position:absolute;width:2px;height:2px;
    background:var(--accent);border-radius:50%;opacity:0;
    animation:float linear infinite;
  }
  @keyframes float{
    0%{transform:translateY(100vh) scale(0);opacity:0;}
    10%{opacity:.6;}
    90%{opacity:.3;}
    100%{transform:translateY(-10vh) scale(1);opacity:0;}
  }

  /* Theme Switcher */
  .theme-switcher{
    position:fixed;top:18px;left:18px;
    display:flex;gap:7px;z-index:100;
  }
  .ts-dot{
    width:22px;height:22px;border-radius:50%;
    cursor:pointer;border:2px solid transparent;
    transition:all .2s;
  }
  .ts-dot:hover,.ts-dot.active{border-color:white;transform:scale(1.15);}
  .ts-amloud{background:linear-gradient(135deg,#5b6af0,#818cf8);}
  .ts-steins{background:linear-gradient(135deg,#00ff41,#39ff14);box-shadow:0 0 8px #00ff4166;}
  .ts-crimson{background:linear-gradient(135deg,#ff1735,#ff6b7a);}
  .ts-amber{background:linear-gradient(135deg,#ffb300,#ffd54f);}
  .ts-cyan{background:linear-gradient(135deg,#00d4ff,#67e8f9);}
  .ts-white{background:linear-gradient(135deg,#ffffff,#dbe3f1);}
  .ts-black{background:linear-gradient(135deg,#050505,#2a2a2a);}

  /* Card */
  .auth-card{
    width:100%;max-width:440px;
    background:var(--surface);
    border:1px solid var(--border2);
    border-radius:20px;
    padding:38px 32px;
    position:relative;z-index:10;
    box-shadow:0 24px 60px rgba(0,0,0,0.6), 0 0 40px var(--accent-glow);
    backdrop-filter:blur(16px);
    display:flex;flex-direction:column;gap:22px;
    animation:cardIn 0.3s ease-out;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(16px) scale(0.98);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }

  /* Header */
  .brand{
    text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;
  }
  .brand-icon{
    width:54px;height:54px;border-radius:14px;
    background:rgba(91, 106, 240, 0.15);
    border:1px solid var(--accent);
    display:flex;align-items:center;justify-content:center;
    font-size:26px;color:var(--accent);
    box-shadow:0 0 20px var(--accent-glow);
  }
  .brand-title{
    font-size:22px;font-weight:700;color:#fff;
    letter-spacing:-0.3px;
  }
  .brand-subtitle{
    font-size:13px;color:var(--muted);
    line-height:1.5;max-width:320px;
  }

  /* Form Elements */
  .input-group{
    display:flex;flex-direction:column;gap:7px;
  }
  .input-label{
    font-size:13px;font-weight:600;color:var(--text);
  }
  .input-field{
    background:var(--surface2);
    border:1px solid var(--border2);
    border-radius:12px;
    padding:13px 16px;
    color:#fff;font-size:14px;
    outline:none;transition:all .2s ease;
    font-family:inherit;
  }
  .input-field:focus{
    border-color:var(--accent);
    box-shadow:0 0 12px var(--accent-glow);
  }

  /* Password Strength */
  .strength-bar{
    height:4px;width:100%;border-radius:2px;
    background:rgba(255,255,255,0.06);
    overflow:hidden;margin-top:4px;
  }
  .strength-fill{
    height:100%;width:0%;
    transition:all 0.3s ease;
  }

  /* Submit Button */
  .submit-btn{
    width:100%;padding:14px;
    background:linear-gradient(135deg, var(--accent), var(--accent2));
    border:none;border-radius:12px;
    color:#fff;font-size:15px;font-weight:700;
    cursor:pointer;transition:all .2s ease;
    box-shadow:0 4px 16px var(--accent-glow);
    display:flex;align-items:center;justify-content:center;gap:8px;
    font-family:inherit;
  }
  .submit-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 6px 20px var(--accent-glow);
  }
  .submit-btn:disabled{
    opacity:0.6;cursor:not-allowed;transform:none;
  }

  .back-link{
    text-align:center;font-size:13px;color:var(--muted);
    cursor:pointer;transition:color 0.2s;text-decoration:none;
    display:inline-block;margin-top:4px;
  }
  .back-link:hover{color:var(--accent);}

  /* Toast Notification */
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:#16162a;border:1px solid var(--accent);
    color:#fff;padding:12px 24px;border-radius:12px;
    font-size:14px;font-weight:600;z-index:1000;
    box-shadow:0 10px 30px rgba(0,0,0,0.8);
    display:none;align-items:center;gap:8px;
    animation:toastIn 0.2s ease;
  }
  @keyframes toastIn{
    from{opacity:0;transform:translate(-50%, 10px);}
    to{opacity:1;transform:translate(-50%, 0);}
  }
</style>
</head>
<body>

<!-- Theme Switcher -->
<div class="theme-switcher">
  <div class="ts-dot ts-amloud active" onclick="setTheme('amloud')" title="Amloud"></div>
  <div class="ts-dot ts-steins" onclick="setTheme('steins')" title="Steins Gate"></div>
  <div class="ts-dot ts-crimson" onclick="setTheme('crimson')" title="Crimson"></div>
  <div class="ts-dot ts-amber" onclick="setTheme('amber')" title="Amber"></div>
  <div class="ts-dot ts-cyan" onclick="setTheme('cyan')" title="Cyan"></div>
  <div class="ts-dot ts-white" onclick="setTheme('white')" title="White"></div>
  <div class="ts-dot ts-black" onclick="setTheme('black')" title="Black"></div>
</div>

<div class="particles" id="particles"></div>

<div class="auth-card">
  <div class="brand">
    <div class="brand-icon">🔐</div>
    <div class="brand-title" id="pageTitle">استعادة وتعيين كلمة المرور</div>
    <div class="brand-subtitle" id="pageSubtitle">أدخل بريدك الإلكتروني ليصلك رابط آمن لتغيير كلمة المرور فوراً</div>
  </div>

  <!-- Form 1: Request Reset Link via Gmail -->
  <div id="requestLinkForm" style="display:flex; flex-direction:column; gap:16px;">
    <div class="input-group">
      <label class="input-label">البريد الإلكتروني (Gmail)</label>
      <input class="input-field" type="email" placeholder="example@gmail.com" id="userEmail" style="direction:ltr; text-align:left;" required />
    </div>
    <button class="submit-btn" id="btnRequestLink" onclick="handleSendResetLink()">
      <span>📧</span> إرسال رابط التعيين إلى Gmail
    </button>
    <a href="login.html" class="back-link">← العودة لصفحة تسجيل الدخول</a>
  </div>

  <!-- Form 2: Set New Password (Triggered after clicking email link) -->
  <div id="setNewPassForm" style="display:none; flex-direction:column; gap:16px;">
    <div class="input-group">
      <label class="input-label">كلمة المرور الجديدة</label>
      <input class="input-field" type="password" placeholder="8 أحرف على الأقل" id="newPassword" oninput="checkStrength(this.value)" required />
      <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
    </div>
    <div class="input-group">
      <label class="input-label">تأكيد كلمة المرور الجديدة</label>
      <input class="input-field" type="password" placeholder="أعد كتابة كلمة المرور" id="confirmPassword" required />
    </div>
    <button class="submit-btn" id="btnSavePassword" onclick="handleSaveNewPassword()">
      <span>🔒</span> حفظ كلمة المرور والدخول للمنصة
    </button>
    <a href="login.html" class="back-link">← العودة لتسجيل الدخول</a>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://fetmbjnehfdtousenflp.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_YFXi-x4HSyrfy_gnM5gLOQ_r3XkeNLj';
  let sb = null;

  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } catch(e){
    console.error('Supabase init error:', e);
  }

  function showToast(msg, isErr) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.style.display = 'flex';
    t.style.borderColor = isErr ? '#ff4757' : 'var(--accent)';
    setTimeout(() => { t.style.display = 'none'; }, 4000);
  }

  window.setTheme = function(theme) {
    document.body.className = '';
    if (theme && theme !== 'amloud') {
      document.body.classList.add('theme-' + theme);
    }
    document.querySelectorAll('.ts-dot').forEach(d => {
      d.classList.toggle('active', d.classList.contains('ts-' + theme));
    });
    localStorage.setItem('lm-theme', theme);
  };

  // Check Password Strength
  window.checkStrength = function(pass) {
    const fill = document.getElementById('strengthFill');
    if (!pass) { fill.style.width = '0%'; return; }
    let score = 0;
    if (pass.length >= 8) score += 35;
    if (/[A-Z]/.test(pass) || /[a-z]/.test(pass)) score += 35;
    if (/[0-9]/.test(pass) || /[^A-Za-z0-9]/.test(pass)) score += 30;
    fill.style.width = score + '%';
    if (score < 40) fill.style.background = '#ff4757';
    else if (score < 80) fill.style.background = '#f0b232';
    else fill.style.background = '#23a55a';
  };

  // Mode 1: Request Reset Link
  window.handleSendResetLink = async function() {
    const email = document.getElementById('userEmail').value.trim();
    if (!email) {
      showToast('يرجى كتابة البريد الإلكتروني.', true);
      return;
    }
    const btn = document.getElementById('btnRequestLink');
    btn.disabled = true;
    btn.innerHTML = '<span>⏳</span> جاري الإرسال...';

    const origin = window.location.origin + window.location.pathname.replace(/[^/]*$/, '');
    const resetUrl = origin + 'reset-password.html?type=recovery';

    try {
      const { error } = await sb.auth.resetPasswordForEmail(email, {
        redirectTo: resetUrl
      });
      btn.disabled = false;
      btn.innerHTML = '<span>📧</span> إرسال رابط التعيين إلى Gmail';

      if (error) {
        showToast('❌ ' + error.message, true);
        return;
      }

      showToast('✅ تم إرسال رابط استعادة الباسورد الرسمي من Lab Members إلى بريدك بنجاح! افحص الـ Inbox أو الـ Spam.', false);
    } catch(e) {
      btn.disabled = false;
      btn.innerHTML = '<span>📧</span> إرسال رابط التعيين إلى Gmail';
      showToast('حدث خطأ أثناء الإرسال: ' + e.message, true);
    }
  };

  // Mode 2: Save New Password
  window.handleSaveNewPassword = async function() {
    const p1 = document.getElementById('newPassword').value;
    const p2 = document.getElementById('confirmPassword').value;

    if (!p1 || !p2) {
      showToast('يرجى ملء جميع الحقول.', true);
      return;
    }
    if (p1.length < 8) {
      showToast('كلمة المرور يجب أن تكون 8 أحرف على الأقل.', true);
      return;
    }
    if (p1 !== p2) {
      showToast('كلمتا المرور غير متطابقتين.', true);
      return;
    }

    const btn = document.getElementById('btnSavePassword');
    btn.disabled = true;
    btn.innerHTML = '<span>⏳</span> جاري حفظ الباسورد...';

    const { data, error } = await sb.auth.updateUser({ password: p1 });
    btn.disabled = false;
    btn.innerHTML = '<span>🔒</span> حفظ كلمة المرور والدخول للمنصة';

    if (error) {
      showToast('❌ ' + error.message, true);
      return;
    }

    showToast('✅ تم تحديث كلمة المرور بنجاح! جاري تحويلك للشات...', false);
    setTimeout(() => {
      window.location.href = 'chat-prototype_1.html';
    }, 1500);
  };

  // Init & Check Recovery Mode
  (function init(){
    const savedTheme = localStorage.getItem('lm-theme') || 'amloud';
    setTheme(savedTheme);

    const params = new URLSearchParams(window.location.search);
    const hash = window.location.hash || '';
    const isRecovery = params.get('type') === 'recovery' || hash.includes('type=recovery') || hash.includes('recovery');

    if (isRecovery) {
      document.getElementById('pageTitle').innerText = 'تعيين كلمة المرور الجديدة';
      document.getElementById('pageSubtitle').innerText = 'أدخل كلمة المرور الجديدة الخاصة بحسابك واضغط حفظ';
      document.getElementById('requestLinkForm').style.display = 'none';
      document.getElementById('setNewPassForm').style.display = 'flex';
    }

    if (sb) {
      sb.auth.onAuthStateChange((event) => {
        if (event === 'PASSWORD_RECOVERY') {
          document.getElementById('pageTitle').innerText = 'تعيين كلمة المرور الجديدة';
          document.getElementById('pageSubtitle').innerText = 'أدخل كلمة المرور الجديدة الخاصة بحسابك واضغط حفظ';
          document.getElementById('requestLinkForm').style.display = 'none';
          document.getElementById('setNewPassForm').style.display = 'flex';
        }
      });
    }

    // Spawn Particles
    const pContainer = document.getElementById('particles');
    if (pContainer) {
      for (let i = 0; i < 25; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.animationDuration = (Math.random() * 8 + 6) + 's';
        p.style.animationDelay = (Math.random() * 5) + 's';
        pContainer.appendChild(p);
      }
    }
  })();
</script>
</body>
</html>
