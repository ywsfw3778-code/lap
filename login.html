<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Members - تسجيل الدخول</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2334d399' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 3h12M12 3v7M5 21h14M5 21l3.5-10.5h7L19 21'/%3E%3Ccircle cx='12' cy='16' r='2' fill='%2334d399'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700&family=VT323&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#07070f;--sidebar:#0b0b18;--surface:#10101e;--surface2:#16162a;
    --border:#ffffff0c;--border2:#ffffff18;
    --accent:#5b6af0;--accent2:#818cf8;--accent-glow:#5b6af040;
    --text:#dde1ff;--muted:#4a4f7a;--online:#34d399;
    --logo-font:'Outfit',sans-serif;--crt:none;
  }
  body.theme-steins{
    --bg:#020c02;--surface:#051405;--surface2:#071a07;
    --border:#00ff4115;--border2:#00ff4128;
    --accent:#00ff41;--accent2:#39ff14;--accent-glow:#00ff4140;
    --text:#c8ffc8;--muted:#3a6b3a;
    --logo-font:'VT323',monospace;
    --crt:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px);
  }
  body.theme-crimson{
    --bg:#0f0608;--surface:#1a080b;--surface2:#220c10;
    --border:#ff173515;--border2:#ff173528;
    --accent:#ff1735;--accent2:#ff6b7a;--accent-glow:#ff173540;
    --text:#ffd6da;--muted:#6b3a3e;
    --logo-font:'Outfit',sans-serif;--crt:none;
  }
  body.theme-amber{
    --bg:#0d0900;--surface:#181000;--surface2:#201500;
    --border:#ffb30015;--border2:#ffb30028;
    --accent:#ffb300;--accent2:#ffd54f;--accent-glow:#ffb30040;
    --text:#fff3cc;--muted:#6b5200;
    --logo-font:'Outfit',sans-serif;--crt:none;
  }
  body.theme-cyan{
    --bg:#00080f;--surface:#001219;--surface2:#001a24;
    --border:#00d4ff15;--border2:#00d4ff28;
    --accent:#00d4ff;--accent2:#67e8f9;--accent-glow:#00d4ff40;
    --text:#ccf5ff;--muted:#1a5566;
    --logo-font:'Share Tech Mono',monospace;--crt:none;
  }
  body.theme-white{
    --bg:#f5f7fb;--surface:#f0f3fa;--surface2:#e6ebf6;
    --border:#1f29370f;--border2:#1f293726;
    --accent:#2563eb;--accent2:#4f46e5;--accent-glow:#2563eb40;
    --text:#0f172a;--muted:#64748b;
    --logo-font:'Outfit',sans-serif;--crt:none;
  }
  body.theme-black{
    --bg:#050505;--surface:#111111;--surface2:#181818;
    --border:#ffffff12;--border2:#ffffff1f;
    --accent:#f1f5f9;--accent2:#d4d4d8;--accent-glow:#ffffff2b;
    --text:#f5f5f5;--muted:#a1a1aa;
    --logo-font:'Share Tech Mono',monospace;--crt:none;
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'IBM Plex Sans Arabic',sans-serif;
    background:var(--bg);color:var(--text);
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    position:relative;overflow:hidden;transition:background .4s,color .4s;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background:
      radial-gradient(ellipse at 25% 40%, var(--accent-glow) 0%, transparent 55%),
      radial-gradient(ellipse at 75% 70%, var(--accent-glow) 0%, transparent 50%);
    pointer-events:none;transition:background .4s;
  }
  body::after{
    content:'';position:fixed;inset:0;
    background:var(--crt);pointer-events:none;z-index:9999;
  }

  /* floating particles bg */
  .particles{position:fixed;inset:0;pointer-events:none;z-index:0;}
  .particle{
    position:absolute;width:2px;height:2px;
    background:var(--accent);border-radius:50%;opacity:0;
    animation:float linear infinite;
  }
  @keyframes float{
    0%{transform:translateY(100vh) scale(0);opacity:0;}
    10%{opacity:.6;}
    90%{opacity:.3;}
    100%{transform:translateY(-10vh) scale(1);opacity:0;}
  }

  /* THEME SWITCHER top-left */
  .theme-switcher{
    position:fixed;top:18px;left:18px;
    display:flex;gap:7px;z-index:100;
  }
  .lang-switcher{
    position:fixed;top:18px;right:18px;z-index:100;display:flex;gap:6px;
  }
  .lang-btn{
    border:1px solid var(--border2);background:var(--surface);color:var(--text);
    border-radius:8px;padding:5px 9px;font-size:11px;cursor:pointer;
  }
  .lang-btn.active{border-color:var(--accent);color:var(--accent);box-shadow:0 0 8px var(--accent-glow);}

  .ts-dot{
    width:22px;height:22px;border-radius:50%;
    cursor:pointer;border:2px solid transparent;
    transition:all .2s;
  }
  .ts-dot:hover,.ts-dot.active{border-color:white;transform:scale(1.15);}
  .ts-amloud{background:linear-gradient(135deg,#5b6af0,#818cf8);}
  .ts-steins{background:linear-gradient(135deg,#00ff41,#39ff14);box-shadow:0 0 8px #00ff4166;}
  .ts-crimson{background:linear-gradient(135deg,#ff1735,#ff6b7a);}
  .ts-amber{background:linear-gradient(135deg,#ffb300,#ffd54f);}
  .ts-cyan{background:linear-gradient(135deg,#00d4ff,#67e8f9);}
  .ts-white{background:linear-gradient(135deg,#ffffff,#dbe3f1);}
  .ts-black{background:linear-gradient(135deg,#050505,#2a2a2a);}

  /* CARD */
  .card{
    position:relative;z-index:10;
    background:var(--surface);
    border:1px solid var(--border2);
    border-radius:24px;
    padding:44px 40px;
    width:400px;max-width:92vw;
    box-shadow:0 0 60px var(--accent-glow), 0 30px 80px rgba(0,0,0,.6);
    animation:cardIn .5s cubic-bezier(.16,1,.3,1);
    transition:background .4s,border-color .4s,box-shadow .4s;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(24px) scale(.97);}
    to{opacity:1;transform:translateY(0) scale(1);}
  }

  /* Logo area */
  .logo-area{text-align:center;margin-bottom:36px;}
  .logo-icon{
    width:64px;height:64px;margin:0 auto 14px;
    background:var(--surface2);
    border:1px solid var(--border2);
    border-radius:18px;
    display:flex;align-items:center;justify-content:center;
    font-size:28px;
    box-shadow:0 0 20px var(--accent-glow);
    transition:background .4s;
  }
  .logo-text{
    font-family:var(--logo-font);
    font-size:28px;font-weight:600;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 0 8px var(--accent-glow));
    letter-spacing:1px;margin-bottom:6px;
    transition:font-family .1s;
  }
  body.theme-steins .logo-text{font-size:34px;letter-spacing:3px;}
  .logo-sub{font-size:13px;color:var(--muted);}

  /* Welcome text */
  .welcome-title{font-size:20px;font-weight:600;text-align:center;margin-bottom:6px;}
  .welcome-sub{font-size:13px;color:var(--muted);text-align:center;margin-bottom:28px;line-height:1.5;}

  /* Google btn */
  .google-btn{
    width:100%;padding:13px 20px;
    background:var(--surface2);
    border:1px solid var(--border2);
    border-radius:13px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:12px;
    color:var(--text);font-family:inherit;font-size:14px;font-weight:500;
    transition:all .2s;
    box-shadow:0 2px 12px rgba(0,0,0,.2);
  }
  .google-btn:hover{
    border-color:var(--accent);
    box-shadow:0 0 20px var(--accent-glow), 0 4px 20px rgba(0,0,0,.3);
    transform:translateY(-1px);
  }
  .google-btn:active{transform:translateY(0);}
  .google-icon{
    width:22px;height:22px;flex-shrink:0;
  }

  .divider{
    display:flex;align-items:center;gap:12px;
    margin:22px 0;
  }
  .divider-line{flex:1;height:1px;background:var(--border);}
  .divider-text{font-size:11px;color:var(--muted);}

  /* Email form */
  .input-group{margin-bottom:14px;}
  .input-label{font-size:12px;color:var(--muted);margin-bottom:6px;display:block;}
  .input-field{
    width:100%;background:var(--surface2);
    border:1px solid var(--border2);
    border-radius:11px;padding:11px 14px;
    color:var(--text);font-family:inherit;font-size:13px;
    outline:none;transition:border-color .2s,box-shadow .2s;
    direction:ltr;
  }
  .input-field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
  .input-field::placeholder{color:var(--muted);}

  .submit-btn{
    width:100%;padding:12px;
    background:transparent;
    border:1px solid var(--accent);
    border-radius:11px;cursor:pointer;
    color:var(--accent);font-family:inherit;font-size:14px;font-weight:600;
    transition:all .2s;
    box-shadow:0 0 12px var(--accent-glow);
    margin-top:4px;
  }
  .submit-btn:hover{background:var(--accent);color:var(--bg);box-shadow:0 0 24px var(--accent);}
  .submit-btn:active{transform:scale(.98);}

  .toggle-form{
    text-align:center;margin-top:16px;
    font-size:12px;color:var(--muted);
  }
  .toggle-form a{color:var(--accent);cursor:pointer;text-decoration:none;}
  .toggle-form a:hover{text-decoration:underline;}

  .terms{
    text-align:center;margin-top:20px;
    font-size:11px;color:var(--muted);line-height:1.6;
  }
  .terms a{color:var(--accent);cursor:pointer;}

  /* loading state */
  .btn-loading{position:relative;pointer-events:none;opacity:.8;}
  .btn-loading::after{
    content:'';
    position:absolute;right:16px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;
    border:2px solid var(--border2);border-top-color:var(--accent);
    border-radius:50%;animation:spin .7s linear infinite;
  }
  @keyframes spin{to{transform:translateY(-50%) rotate(360deg);}}

  /* toast */
  .toast{
    position:fixed;bottom:24px;right:50%;transform:translateX(50%);
    background:var(--surface);border:1px solid var(--border2);
    border-radius:12px;padding:12px 20px;font-size:13px;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
    opacity:0;transition:opacity .3s;pointer-events:none;z-index:1000;
    white-space:nowrap;
  }
  .toast.show{opacity:1;}
  .toast.success{border-color:var(--online);color:var(--online);}
  .toast.error{border-color:#ff4444;color:#ff8888;}

  /* tabs */
  .tabs{display:flex;gap:0;margin-bottom:20px;background:var(--surface2);border-radius:10px;padding:3px;}
  .tab{
    flex:1;padding:8px;text-align:center;font-size:13px;font-weight:500;
    cursor:pointer;border-radius:8px;color:var(--muted);transition:all .2s;
  }
  .tab.active{background:var(--surface);color:var(--text);box-shadow:0 2px 8px rgba(0,0,0,.2);}
/* MOBILE RESPONSIVE */
@media (max-width: 640px){
  body{min-height:100dvh;align-items:flex-start;justify-content:flex-start;padding:74px 12px 20px;overflow-y:auto;}
  .theme-switcher{top:10px;left:10px;gap:5px;max-width:calc(100vw - 24px);flex-wrap:wrap;}
  .lang-switcher{top:10px;right:10px;}
  .ts-dot{width:18px;height:18px;}
  .lang-btn{padding:4px 8px;font-size:10px;}
  .card{width:100%;max-width:100%;padding:24px 16px;border-radius:18px;}
  .logo-area{margin-bottom:24px;}
  .logo-icon{width:56px;height:56px;border-radius:14px;font-size:24px;}
  .logo-text{font-size:24px;}
  body.theme-steins .logo-text{font-size:28px;letter-spacing:2px;}
  .logo-sub{font-size:12px;}
  .welcome-title{font-size:18px;}
  .welcome-sub{font-size:12px;margin-bottom:18px;}
  .google-btn{padding:11px 14px;font-size:13px;}
  .divider{margin:16px 0;}
  .tabs{margin-bottom:14px;}
  .tab{font-size:12px;padding:7px;}
  .input-field{padding:10px 11px;font-size:13px;}
  .submit-btn{padding:11px;font-size:13px;}
  .terms{margin-top:14px;font-size:10px;}
  .toast{bottom:12px;right:12px;transform:none;max-width:calc(100vw - 24px);white-space:normal;}
}
</style>
</head>
<body id="appBody">

<!-- particles -->
<div class="particles" id="particles"></div>

<!-- theme switcher -->
<div class="theme-switcher">
  <div class="ts-dot ts-amloud active" id="dot-amloud" onclick="setTheme('amloud')" title="Amloud"></div>
  <div class="ts-dot ts-steins" id="dot-steins" onclick="setTheme('steins')" title="Steins;Gate"></div>
  <div class="ts-dot ts-crimson" id="dot-crimson" onclick="setTheme('crimson')" title="Crimson"></div>
  <div class="ts-dot ts-amber" id="dot-amber" onclick="setTheme('amber')" title="Amber"></div>
  <div class="ts-dot ts-cyan" id="dot-cyan" onclick="setTheme('cyan')" title="Cyan"></div>
  <div class="ts-dot ts-white" id="dot-white" onclick="setTheme('white')" title="White"></div>
  <div class="ts-dot ts-black" id="dot-black" onclick="setTheme('black')" title="Black"></div>
</div>

<div class="lang-switcher">
  <button class="lang-btn active" id="lang-ar" onclick="setLang('ar')">AR</button>
  <button class="lang-btn" id="lang-en" onclick="setLang('en')">EN</button>
</div>

<!-- CARD -->
<div class="card">
  <div class="logo-area">
    <div class="logo-icon">🧪</div>
    <div class="logo-text" id="logoText">Lab Members</div>
    <div class="logo-sub">Future Gadget Lab - Communication System</div>
  </div>

  <div class="welcome-title">أهلا بك 👋</div>
  <div class="welcome-sub">سجل دخولك عشان تتواصل مع أعضاء المعمل</div>

  <!-- Google -->
  <button class="google-btn" id="googleBtn" onclick="handleGoogle()">
    <svg class="google-icon" viewBox="0 0 24 24">
      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
    </svg>
    متابعة بحساب Google
  </button>

  <div class="divider">
    <div class="divider-line"></div>
    <div class="divider-text">أو بالإيميل</div>
    <div class="divider-line"></div>
  </div>

  <!-- tabs -->
  <div class="tabs">
    <div class="tab active" id="tab-login" onclick="switchTab('login')">تسجيل الدخول</div>
    <div class="tab" id="tab-register" onclick="switchTab('register')">إنشاء حساب</div>
  </div>

  <!-- login form -->
  <div id="loginForm">
    <div class="input-group">
      <label class="input-label">الإيميل</label>
      <input class="input-field" type="email" placeholder="example@gmail.com" id="loginEmail">
    </div>
    <div class="input-group">
      <label class="input-label">الباسورد</label>
      <input class="input-field" type="password" placeholder="••••••••" id="loginPass">
    </div>
    <button class="submit-btn" onclick="handleLogin()">دخول</button>
    <div class="toggle-form">نسيت الباسورد؟ <a onclick="switchTab('forgot')">استعادة عبر Gmail</a></div>
  </div>

  <!-- register form -->
  <div id="registerForm" style="display:none;">
    <div class="input-group">
      <label class="input-label">الاسم</label>
      <input class="input-field" type="text" placeholder="اسمك" id="regName" style="direction:rtl;">
    </div>
    <div class="input-group">
      <label class="input-label">الإيميل</label>
      <input class="input-field" type="email" placeholder="example@gmail.com" id="regEmail">
    </div>
    <div class="input-group">
      <label class="input-label">الباسورد</label>
      <input class="input-field" type="password" placeholder="8 أحرف على الأقل" id="regPass">
    </div>
    <button class="submit-btn" onclick="handleRegister()">إنشاء حساب</button>
  </div>

  <!-- forgot password form -->
  <div id="forgotForm" style="display:none;">
    <div class="input-group">
      <label class="input-label">أدخل بريدك الإلكتروني (Gmail)</label>
      <input class="input-field" type="email" placeholder="example@gmail.com" id="forgotEmail">
    </div>
    <button class="submit-btn" onclick="handleSendPasswordReset()" id="btnSendReset">إرسال رابط الاستعادة إلى Gmail 📧</button>
    <div class="toggle-form" style="margin-top:14px;"><a onclick="switchTab('login')">← العودة لتسجيل الدخول</a></div>
  </div>

  <!-- recovery form (new password) -->
  <div id="recoveryForm" style="display:none;">
    <div class="input-group">
      <label class="input-label" id="lblNewPass">الباسورد الجديد</label>
      <input class="input-field" type="password" placeholder="8 أحرف على الأقل" id="recoveryPass">
    </div>
    <div class="input-group">
      <label class="input-label" id="lblNewPassConfirm">تأكيد الباسورد الجديد</label>
      <input class="input-field" type="password" placeholder="أعد كتابة الباسورد" id="recoveryPassConfirm">
    </div>
    <button class="submit-btn" onclick="handleUpdatePassword()" id="btnSaveNewPass">حفظ الباسورد الجديد والدخول 🔒</button>
  </div>

  <div class="terms">
    بالدخول، أنت موافق على <a>شروط الاستخدام</a> و<a>سياسة الخصوصية</a>
  </div>
</div>

<!-- toast -->
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://fetmbjnehfdtousenflp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_YFXi-x4HSyrfy_gnM5gLOQ_r3XkeNLj';
let supabaseClient = null;
let authRedirectArmed = false;

function getSupabase(){
  if (supabaseClient) return supabaseClient;
  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    throw new Error('Supabase SDK failed to load');
  }
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {
      persistSession: true,
      detectSessionInUrl: true,
      autoRefreshToken: true
    }
  });
  return supabaseClient;
}

async function redirectWhenSessionReady(target = 'chat-prototype_1.html'){
  let sb;
  try{
    sb = getSupabase();
  }catch(_e){
    window.location.href = target;
    return;
  }
  for(let i = 0; i < 30; i++){
    try{
      const { data: { session } } = await sb.auth.getSession();
      if(session?.user){
        window.location.href = target;
        return;
      }
    }catch(_e){}
    await new Promise((resolve) => setTimeout(resolve, 150));
  }
  window.location.href = target;
}

/* particles */
const pEl = document.getElementById('particles');
for(let i=0;i<25;i++){
  const p=document.createElement('div');
  p.className='particle';
  p.style.cssText=`left:${Math.random()*100}%;width:${Math.random()*3+1}px;height:${Math.random()*3+1}px;animation-duration:${Math.random()*15+8}s;animation-delay:${Math.random()*10}s;`;
  pEl.appendChild(p);
}

/* toast */
function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className='toast '+type+' show';
  setTimeout(()=>t.classList.remove('show'),3500);
}

function setLoading(btn, loading, originalHTML){
  if(loading){
    btn.classList.add('btn-loading');
    btn.disabled=true;
  } else {
    btn.classList.remove('btn-loading');
    btn.disabled=false;
    if(originalHTML) btn.innerHTML=originalHTML;
  }
}

/* theme */
window.setTheme = function(name){
  document.getElementById('appBody').className='theme-'+name;
  document.querySelectorAll('.ts-dot').forEach(d=>d.classList.remove('active'));
  const dot=document.getElementById('dot-'+name);
  if(dot) dot.classList.add('active');
  localStorage.setItem('lm-theme',name);
  document.getElementById('logoText').style.fontSize = name==='steins' ? '34px' : '';
};

const i18n = {
  ar: {
    title: 'Lab Members - تسجيل الدخول',
    logoSub: 'Future Gadget Lab - Communication System',

  document.title = t.title;
  document.documentElement.lang = currentLang;
  document.documentElement.dir = 'rtl';

  document.querySelector('.logo-icon').textContent = '🧪';
  document.querySelector('.logo-sub').textContent = t.logoSub;
  document.querySelector('.welcome-title').textContent = t.welcomeTitle;
  document.querySelector('.welcome-sub').textContent = t.welcomeSub;
  document.getElementById('tab-login').textContent = t.tabLogin;
  document.getElementById('tab-register').textContent = t.tabRegister;

  const labels = document.querySelectorAll('.input-label');
  if(labels[0]) labels[0].textContent = t.lblEmail;
  if(labels[1]) labels[1].textContent = t.lblPass;
  if(labels[2]) labels[2].textContent = t.lblName;
  if(labels[3]) labels[3].textContent = t.lblEmail;
  if(labels[4]) labels[4].textContent = t.lblPass;

  document.getElementById('loginPass').placeholder = t.phPass;
  document.getElementById('regName').placeholder = t.phName;
  document.getElementById('regPass').placeholder = t.phRegPass;

  document.querySelector('#loginForm .submit-btn').textContent = t.btnLogin;
  document.querySelector('#registerForm .submit-btn').textContent = t.btnRegister;
  document.querySelector('#loginForm .toggle-form').innerHTML = `${t.forgot} <a onclick="handleReset()">${t.restore}</a>`;
  document.querySelector('.terms').textContent = t.terms;

  document.getElementById('lang-ar').classList.toggle('active', currentLang === 'ar');
  document.getElementById('lang-en').classList.toggle('active', currentLang === 'en');
};

window.switchTab = function(tab){
  const isRecovery = tab === 'recovery';
  const isForgot = tab === 'forgot';
  
  // Hide or show tabs header
  const tabsContainer = document.querySelector('.tabs');
  if (tabsContainer) tabsContainer.style.display = (isRecovery || isForgot) ? 'none' : 'flex';
  
  const googleBtn = document.getElementById('googleBtn');
  if (googleBtn) googleBtn.style.display = (isRecovery || isForgot) ? 'none' : 'flex';
  
  const divider = document.querySelector('.divider');
  if (divider) divider.style.display = (isRecovery || isForgot) ? 'none' : 'flex';
  
  const welcomeTitle = document.querySelector('.welcome-title');
  const welcomeSub = document.querySelector('.welcome-sub');
  
  if (isRecovery) {
    if (welcomeTitle) welcomeTitle.textContent = currentLang === 'en' ? 'Reset Password 🔒' : 'تعيين الباسورد الجديد 🔒';
    if (welcomeSub) welcomeSub.textContent = currentLang === 'en' ? 'Enter your new password below' : 'اكتب الباسورد الجديد لحسابك بالأسفل';
  } else if (isForgot) {
    if (welcomeTitle) welcomeTitle.textContent = currentLang === 'en' ? 'Recover Password 📧' : 'استعادة الباسورد عبر Gmail 📧';
    if (welcomeSub) welcomeSub.textContent = currentLang === 'en' ? 'We will send a secure reset link to your email' : 'سنرسل رابط أمان إلى بريدك الإلكتروني لتعيين باسورد جديد';
    const emailVal = document.getElementById('loginEmail')?.value || '';
    if (emailVal && document.getElementById('forgotEmail')) {
      document.getElementById('forgotEmail').value = emailVal;
    }
  } else {
    if (welcomeTitle) welcomeTitle.textContent = tr('welcomeTitle');
    if (welcomeSub) welcomeSub.textContent = tr('welcomeSub');
  }

  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  
  document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = tab === 'register' ? 'block' : 'none';
  document.getElementById('forgotForm').style.display = tab === 'forgot' ? 'block' : 'none';
  document.getElementById('recoveryForm').style.display = tab === 'recovery' ? 'block' : 'none';
};

// --- Device & Security Detection Module ---
window.detectClientDevice = function() {
  const ua = navigator.userAgent || '';
  
  // 1. Detect OS
  let os = 'Windows';
  if (/Windows NT 10.0/i.test(ua)) os = 'Windows 10/11';
  else if (/Windows NT 6.3/i.test(ua)) os = 'Windows 8.1';
  else if (/Windows NT 6.1/i.test(ua)) os = 'Windows 7';
  else if (/Android/i.test(ua)) {
    const match = ua.match(/Android\s([0-9\.]+)/i);
    os = match ? `Android ${match[1]}` : 'Android';
  }
  else if (/iPhone/i.test(ua)) os = 'iOS (iPhone)';
  else if (/iPad/i.test(ua)) os = 'iPadOS (iPad)';
  else if (/Macintosh|Mac OS X/i.test(ua)) os = 'macOS';
  else if (/Linux/i.test(ua)) os = 'Linux';

  // 2. Detect Browser / App
  let browser = 'Chrome';
  if (window.AndroidBridge || /wv|WebView/i.test(ua)) browser = 'Lab Members App';
  else if (/Edg\//i.test(ua)) browser = 'Microsoft Edge';
  else if (/OPR\/|Opera/i.test(ua)) browser = 'Opera';
  else if (/Chrome\//i.test(ua)) browser = 'Google Chrome';
  else if (/Firefox\//i.test(ua)) browser = 'Mozilla Firefox';
  else if (/Safari\//i.test(ua) && !/Chrome/i.test(ua)) browser = 'Apple Safari';

  // 3. Detect Device Type
  let deviceType = 'desktop';
  if (/(tablet|ipad|playbook|silk)|(android(?!.*mobi))/i.test(ua)) {
    deviceType = 'tablet';
  } else if (/Mobile|iP(hone|od)|Android|BlackBerry|IEMobile|Kindle|Silk-Accelerated|(hpw|web)OS|Opera M(obi|ini)/i.test(ua)) {
    deviceType = 'mobile';
  }

  // 4. Device Name
  const deviceTypeIcon = deviceType === 'mobile' ? '📱 هاتف' : (deviceType === 'tablet' ? '📟 تابلت' : '💻 كمبيوتر');
  const deviceName = `${deviceTypeIcon} (${os} - ${browser})`;

  // 5. Persistent Device Fingerprint ID
  let fid = localStorage.getItem('lm-device-fid');
  if (!fid) {
    const rawSeed = `${screen.width}x${screen.height}_${screen.colorDepth}_${navigator.language}_${os}_${browser}_${Math.random()}`;
    fid = 'dev_' + btoa(rawSeed).replace(/[^a-zA-Z0-9]/g, '').substring(0, 24);
    localStorage.setItem('lm-device-fid', fid);
  }

  return {
    fid,
    deviceName,
    deviceType,
    os,
    browser,
    time: new Date().toLocaleString('ar-EG', { dateStyle: 'full', timeStyle: 'short' })
  };
};

window.sendNewDeviceSecurityAlert = async function(user, device) {
  if (!user || !user.email) return;
  const userEmail = user.email;
  const userName = user.user_metadata?.full_name || user.user_metadata?.name || userEmail.split('@')[0];

  console.log(`[Security] Dispatching New Device Login Alert to: ${userEmail} for device: ${device.deviceName}`);

  const alertData = {
    email: userEmail,
    name: userName,
    device: device.deviceName,
    time: device.time,
    resetUrl: window.location.origin + window.location.pathname.replace(/[^/]*$/, '') + 'login.html?type=recovery'
  };

  // Save pending alert for in-app alert banner
  localStorage.setItem('lm-pending-security-alert', JSON.stringify(alertData));
};

window.checkAndRecordDeviceLogin = async function(sb, user) {
  if (!sb || !user) return;
  try {
    const device = window.detectClientDevice();
    const { data: isNew, error } = await sb.rpc('register_device_and_check_is_new', {
      p_device_fid: device.fid,
      p_device_name: device.deviceName,
      p_device_type: device.deviceType,
      p_os: device.os,
      p_browser: device.browser,
      p_ip: ''
    });

    if (!error && isNew) {
      console.warn('[Security] New device detected for user:', device.deviceName);
      await window.sendNewDeviceSecurityAlert(user, device);
    } else if (error) {
      const knownKey = 'lm-known-acc-' + user.id;
      if (!localStorage.getItem(knownKey)) {
        localStorage.setItem(knownKey, device.fid);
        await window.sendNewDeviceSecurityAlert(user, device);
      }
    }
  } catch(e) {
    console.warn('[Security] Device check error:', e);
  }
};

window.handleLogin = async function(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass  = document.getElementById('loginPass').value;
  if(!email||!pass){ showToast(tr('errLoginRequired'),'error'); return; }

  let sb;
  try { sb = getSupabase(); } catch(e){ showToast(tr('errSdk'),'error'); return; }

  const btn = document.querySelector('#loginForm .submit-btn');
  setLoading(btn, true);
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pass });
  setLoading(btn, false);
  if(error){ showToast('❌ '+error.message,'error'); return; }
  
  if (data?.user) {
    await window.checkAndRecordDeviceLogin(sb, data.user);
  }
  
  showToast(tr('okLogin'));
  redirectWhenSessionReady('chat-prototype_1.html');
};

window.handleRegister = async function(){
  const name  = document.getElementById('regName').value.trim();
  const email = document.getElementById('regEmail').value.trim();
  const pass  = document.getElementById('regPass').value;
  if(!name||!email||!pass){ showToast(tr('errAllFields'),'error'); return; }
  if(pass.length<8){ showToast(tr('errPassLen'),'error'); return; }

  let sb;
  try { sb = getSupabase(); } catch(e){ showToast(tr('errSdk'),'error'); return; }

  const btn = document.querySelector('#registerForm .submit-btn');
  setLoading(btn, true);

  const redirectUrl = window.location.href.split('?')[0].split('#')[0].split('login.html')[0] + 'login.html';
  const { data, error } = await sb.auth.signUp({
    email,
    password: pass,
    options: { 
      data: { full_name: name },
      emailRedirectTo: redirectUrl
    }
  });

  setLoading(btn, false);
  if(error){ showToast('❌ '+error.message,'error'); return; }

  if(data && data.session){
    if (data.user) await window.checkAndRecordDeviceLogin(sb, data.user);
    showToast(tr('okRegisterAuto'));
    redirectWhenSessionReady('chat-prototype_1.html');
    return;
  }

  // محاولة تسجيل الدخول المباشر في حال تفعيل التوثيق الفوري
  try {
    const { data: signInData, error: signInErr } = await sb.auth.signInWithPassword({ email, password: pass });
    if (!signInErr && signInData?.session) {
      if (signInData.user) await window.checkAndRecordDeviceLogin(sb, signInData.user);
      showToast(tr('okRegisterAuto'));
      redirectWhenSessionReady('chat-prototype_1.html');
      return;
    }
  } catch (_e) {}

  // في حال كان تأكيد البريد مطلوباً في Supabase
  alert(`✅ تم إنشاء حسابك بنجاح!\n\nتم إرسال رابط تأكيد إلى بريدك الإلكتروني:\n${email}\n\nيرجى فتح بريدك الإلكتروني والضغط على الرابط لتأكيد الحساب، ثم العودة لتسجيل الدخول.`);
  showToast(tr('okRegisterPending'));
  document.getElementById('loginEmail').value = email;
  document.getElementById('loginPass').value = pass;
  window.switchTab('login');
};

window.handleGoogle = async function(){

window.handleUpdatePassword = async function() {
  const pass = document.getElementById('recoveryPass').value;
  const passConfirm = document.getElementById('recoveryPassConfirm').value;
  
  if (!pass || !passConfirm) {
    showToast(tr('errAllFields'), 'error');
    return;
  }
  if (pass.length < 8) {
    showToast(tr('errPassLen'), 'error');
    return;
  }
  if (pass !== passConfirm) {
    showToast(currentLang === 'en' ? 'Passwords do not match' : 'الباسورد غير متطابق', 'error');
    return;
  }
  
  let sb;
  try { sb = getSupabase(); } catch(e){ showToast(tr('errSdk'), 'error'); return; }
  
  const btn = document.getElementById('btnSaveNewPass');
  setLoading(btn, true);
  
  const { data, error } = await sb.auth.updateUser({ password: pass });
  setLoading(btn, false);
  
  if (error) {
    showToast('❌ ' + error.message, 'error');
    return;
  }
  
  if (data?.user) {
    await window.checkAndRecordDeviceLogin(sb, data.user);
  }

  showToast(currentLang === 'en' ? '✅ Password updated successfully! Redirecting...' : '✅ تم تحديث الباسورد بنجاح وجاري تحويلك...');
  setTimeout(() => {
    window.location.href = 'chat-prototype_1.html';
  }, 1500);
};

(async function init(){
  const savedTheme = localStorage.getItem('lm-theme') || 'amloud';
  window.setTheme(savedTheme);
  window.setLang(currentLang);

  // استعادة جلسة الدخول المبرمجة مع أندرويد لتجاوز عزل ملفات WebView
  const params = new URLSearchParams(window.location.search);
  const logoutReturn = params.has('logout');
  
  if (!logoutReturn) {
    try {
      if (window.AndroidBridge && typeof window.AndroidBridge.getSavedAuthSession === 'function') {
        const savedStr = window.AndroidBridge.getSavedAuthSession();
        if (savedStr) {
          const saved = JSON.parse(savedStr);
          if (saved.accessToken && saved.refreshToken) {
            console.log("[AuthBridge] Restoring native session in login...");
            const { data } = await getSupabase().auth.setSession({
              access_token: saved.accessToken,
              refresh_token: saved.refreshToken
            });
            if (data && data.session) {
              window.location.href = 'chat-prototype_1.html';
              return;
            }
          }
        }
      }
    } catch (e) {
      console.error("AuthBridge restore error in login:", e);
    }
  }

  // Extract auth parameters from both query and hash fragment (bypassing WebView file:// limits)
  const hashParams = new URLSearchParams(window.location.hash.substring(1));
  const searchParams = new URLSearchParams(window.location.search);
  
  const code = searchParams.get('code') || hashParams.get('code');
  const accessToken = hashParams.get('access_token') || searchParams.get('access_token');
  const refreshToken = hashParams.get('refresh_token') || searchParams.get('refresh_token');

  try {
    const sb = getSupabase();

    // If implicit flow returned tokens directly
    if (accessToken && refreshToken) {
      console.log('[Auth] Setting session manually via tokens...');
      try {
        const { data, error } = await sb.auth.setSession({
          access_token: accessToken,
          refresh_token: refreshToken
        });
        if (error) {
          console.error('[Auth] Manual setSession failed:', error.message);
        } else if (data && data.session) {
          console.log('[Auth] Manual setSession succeeded! Redirecting...');
          if (window.AndroidBridge && typeof window.AndroidBridge.saveAuthSession === 'function') {
            window.AndroidBridge.saveAuthSession(data.session.access_token, data.session.refresh_token || '', data.session.user.id, data.session.user.email || '');
          }
          window.location.href = 'chat-prototype_1.html';
          return;
        }
      } catch (err) {
        console.error('[Auth] Manual setSession exception:', err);
      }
    }

    if (code) {
      try {
        const { error } = await sb.auth.exchangeCodeForSession(code);
        if (error) {
          console.error('Manual code exchange failed:', error.message);
        } else {
          window.location.href = 'chat-prototype_1.html';
          return;
        }
      } catch (err) {
        console.error('Manual code exchange error:', err);
      }
    }

    const params = new URLSearchParams(window.location.search);
    const hashParams = new URLSearchParams(window.location.hash.startsWith('#') ? window.location.hash.slice(1) : window.location.hash);
    
    // Check for OAuth or Auth errors returned in URL
    const oauthError = params.get('error_description') || params.get('error') || hashParams.get('error_description') || hashParams.get('error');
    if (oauthError) {
      console.warn('OAuth redirect error:', oauthError);
      showToast('❌ خطأ في تسجيل الدخول بجوجل: ' + decodeURIComponent(oauthError.replace(/\+/g, ' ')), 'error');
    }

    const logoutReturn = params.has('logout');
    let isRecovering = params.get('type') === 'recovery' || window.location.hash.includes('type=recovery') || window.location.hash.includes('recovery');
    
    if (isRecovering) {
      window.switchTab('recovery');
    }
    
    if(logoutReturn){
      try{
        Object.keys(localStorage).forEach(k => {
          if (k.startsWith('sb-') && k.endsWith('-auth-token')) {
            localStorage.removeItem(k);
          }
        });
        Object.keys(sessionStorage).forEach(k => {
          if (k.startsWith('sb-') && k.endsWith('-auth-token')) {
            sessionStorage.removeItem(k);
          }
        });
      }catch(_e){}
      if (window.AndroidBridge && typeof window.AndroidBridge.clearAuthSession === 'function') {
        try { window.AndroidBridge.clearAuthSession(); } catch(_e){}
      }
      try{
        await sb.auth.signOut({ scope: 'local' });
      }catch(_e){
        try { await sb.auth.signOut(); } catch(_ignore){}
      }
      try{
        const cleanUrl = window.location.pathname;
        window.history.replaceState({}, document.title, cleanUrl);
      }catch(_e){}
    }
    if(!authRedirectArmed){
      authRedirectArmed = true;
      sb.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY') {
          isRecovering = true;
          window.switchTab('recovery');
        } else if((event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED') && session?.user){
          if (!isRecovering) {
            if (window.AndroidBridge && typeof window.AndroidBridge.saveAuthSession === 'function') {
              window.AndroidBridge.saveAuthSession(session.access_token, session.refresh_token || '', session.user.id, session.user.email || '');
            }
            window.location.href = 'chat-prototype_1.html';
          }
        }
      });
    }
    const { data: { session } } = await sb.auth.getSession();
    if(session && !logoutReturn && !isRecovering) window.location.href = 'chat-prototype_1.html';
  } catch(e){
    console.warn('init auth skipped:', e?.message || e);
  }
})();
</script>
