<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Members — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07070f;--surface:#10101e;--surface2:#16162a;
    --border:#ffffff0c;--border2:#ffffff18;
    --accent:#5b6af0;--accent2:#818cf8;--accent-glow:#5b6af033;
    --text:#dde1ff;--muted:#4a4f7a;--online:#34d399;--error:#ff4444;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'IBM Plex Sans Arabic',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:30px 20px;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 30% 30%,var(--accent-glow) 0%,transparent 60%);pointer-events:none;}

  .container{max-width:700px;margin:0 auto;position:relative;z-index:1;}

  .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px;}
  .logo{font-family:'Share Tech Mono',monospace;font-size:22px;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 0 6px var(--accent-glow));}
  .badge{font-size:10px;background:var(--accent-glow);border:1px solid var(--accent);color:var(--accent);padding:3px 10px;border-radius:99px;font-family:'Share Tech Mono',monospace;}

  .card{background:var(--surface);border:1px solid var(--border2);border-radius:18px;padding:26px;margin-bottom:20px;box-shadow:0 0 30px var(--accent-glow);}
  .card-title{font-size:14px;font-weight:600;color:var(--muted);font-family:'Share Tech Mono',monospace;letter-spacing:1px;text-transform:uppercase;margin-bottom:18px;}

  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  .form-group{display:flex;flex-direction:column;gap:6px;}
  .form-group.full{grid-column:1/-1;}
  label{font-size:11px;color:var(--muted);}
  input{background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:10px 13px;color:var(--text);font-family:inherit;font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s;direction:ltr;}
  input[type="text"]{direction:rtl;}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
  input::placeholder{color:var(--muted);}

  .btn{padding:11px 20px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px;font-weight:600;transition:all .2s;border:1px solid var(--accent);color:var(--accent);background:var(--accent-glow);}
  .btn:hover{background:var(--accent);color:var(--bg);box-shadow:0 0 16px var(--accent);}
  .btn:disabled{opacity:.5;pointer-events:none;}
  .btn-full{width:100%;}
  .btn-danger{border-color:var(--error);color:var(--error);background:transparent;}
  .btn-danger:hover{background:var(--error);color:white;box-shadow:0 0 16px var(--error);}
  .btn-sm{padding:6px 12px;font-size:11px;}

  .users-list{display:flex;flex-direction:column;gap:8px;}
  .user-row{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;}
  .user-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;flex-shrink:0;}
  .user-info{flex:1;min-width:0;}
  .user-name{font-size:13px;font-weight:500;}
  .user-email{font-size:11px;color:var(--muted);}
  .user-meta{font-size:10px;color:var(--muted);white-space:nowrap;}
  .confirmed{color:var(--online);}
  .unconfirmed{color:#f59e0b;}

  .empty{text-align:center;padding:30px;color:var(--muted);font-size:13px;}

  .toast{position:fixed;bottom:24px;right:50%;transform:translateX(50%);background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:11px 20px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.5);opacity:0;transition:opacity .3s;pointer-events:none;z-index:1000;white-space:nowrap;}
  .toast.show{opacity:1;}
  .toast.success{border-color:var(--online);color:var(--online);}
  .toast.error{border-color:var(--error);color:#ff8888;}

  .loading{display:inline-block;width:14px;height:14px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-left:6px;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px;}
  .stat{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:16px;text-align:center;}
  .stat-num{font-size:28px;font-weight:700;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
  .stat-label{font-size:11px;color:var(--muted);margin-top:4px;}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <span class="logo">Lab Members</span>
    <span class="badge">⚙️ ADMIN PANEL</span>
  </div>

  <!-- stats -->
  <div class="stats">
    <div class="stat"><div class="stat-num" id="totalUsers">—</div><div class="stat-label">إجمالي المستخدمين</div></div>
    <div class="stat"><div class="stat-num" id="confirmedUsers">—</div><div class="stat-label">مؤكدين</div></div>
    <div class="stat"><div class="stat-num" id="pendingUsers">—</div><div class="stat-label">في الانتظار</div></div>
  </div>

  <!-- add user -->
  <div class="card">
    <div class="card-title">// إضافة مستخدم جديد</div>
    <div class="form-row">
      <div class="form-group">
        <label>الاسم</label>
        <input type="text" id="newName" placeholder="اسم المستخدم">
      </div>
      <div class="form-group">
        <label>الإيميل</label>
        <input type="email" id="newEmail" placeholder="example@gmail.com">
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>الباسورد</label>
        <input type="text" id="newPass" placeholder="اكتب باسورد قوي">
      </div>
      <div class="form-group" style="justify-content:flex-end;">
        <button class="btn" id="addBtn" onclick="addUser()">+ إضافة</button>
      </div>
    </div>
  </div>

  <!-- users list -->
  <div class="card">
    <div class="card-title" style="display:flex;justify-content:space-between;align-items:center;">
      <span>// المستخدمين</span>
      <button class="btn btn-sm" onclick="loadUsers()">🔄 تحديث</button>
    </div>
    <div class="users-list" id="usersList">
      <div class="empty">جاري التحميل... <span class="loading"></span></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const URL  = 'https://fetmbjnehfdtousenflp.supabase.co';
const KEY  = '';

const colors = [
  {bg:'#12123a',text:'#818cf8'},{bg:'#0d2010',text:'#34d399'},
  {bg:'#200a0a',text:'#f87171'},{bg:'#1a1400',text:'#fbbf24'},
  {bg:'#001525',text:'#38bdf8'},{bg:'#1a0a20',text:'#c084fc'},
];

function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+type+' show';
  setTimeout(()=>t.classList.remove('show'),3500);
}

async function api(path, method='GET', body=null){
  const res = await fetch(URL+path, {
    method,
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+KEY,'apikey':KEY},
    body: body ? JSON.stringify(body) : null
  });
  return res.json();
}

async function loadUsers(){
  document.getElementById('usersList').innerHTML='<div class="empty">جاري التحميل... <span class="loading"></span></div>';
  const data = await api('/auth/v1/admin/users');
  const users = data.users || [];

  const confirmed = users.filter(u=>u.email_confirmed_at).length;
  document.getElementById('totalUsers').textContent = users.length;
  document.getElementById('confirmedUsers').textContent = confirmed;
  document.getElementById('pendingUsers').textContent = users.length - confirmed;

  if(!users.length){
    document.getElementById('usersList').innerHTML='<div class="empty">مفيش مستخدمين لسه</div>';
    return;
  }

  document.getElementById('usersList').innerHTML = users.map((u,i)=>{
    const c = colors[i % colors.length];
    const name = u.user_metadata?.full_name || u.email.split('@')[0];
    const init = name.charAt(0).toUpperCase();
    const isConfirmed = !!u.email_confirmed_at;
    const date = new Date(u.created_at).toLocaleDateString('ar-EG');
    return `
      <div class="user-row" id="user-${u.id}">
        <div class="user-avatar" style="background:${c.bg};color:${c.text};">${init}</div>
        <div class="user-info">
          <div class="user-name">${name}</div>
          <div class="user-email">${u.email}</div>
        </div>
        <div class="user-meta">
          <div class="${isConfirmed?'confirmed':'unconfirmed'}">${isConfirmed?'✓ مؤكد':'⏳ انتظار'}</div>
          <div>${date}</div>
        </div>
        <button class="btn btn-sm btn-danger" onclick="deleteUser('${u.id}')">حذف</button>
      </div>`;
  }).join('');
}

async function addUser(){
  const name  = document.getElementById('newName').value.trim();
  const email = document.getElementById('newEmail').value.trim();
  const pass  = document.getElementById('newPass').value.trim();
  if(!name||!email||!pass){showToast('اكمل كل البيانات','error');return;}
  if(pass.length<6){showToast('الباسورد 6 أحرف على الأقل','error');return;}

  const btn = document.getElementById('addBtn');
  btn.disabled=true; btn.textContent='جاري الإضافة...';

  const data = await api('/auth/v1/admin/users','POST',{
    email, password: pass,
    email_confirm: true,
    user_metadata:{ full_name: name }
  });

  btn.disabled=false; btn.textContent='+ إضافة';

  if(data.error||data.msg){
    showToast('❌ '+(data.error||data.msg),'error'); return;
  }

  showToast('✅ تم إضافة '+name+' بنجاح!');
  document.getElementById('newName').value='';
  document.getElementById('newEmail').value='';
  document.getElementById('newPass').value='';
  loadUsers();
}

async function deleteUser(id){
  if(!confirm('متأكد إنك عايز تحذف المستخدم ده؟')) return;
  const data = await api('/auth/v1/admin/users/'+id,'DELETE');
  if(data.error){showToast('❌ '+data.error,'error');return;}
  showToast('✅ تم الحذف');
  document.getElementById('user-'+id)?.remove();
  loadUsers();
}

loadUsers();
</script>
</body>
</html>
